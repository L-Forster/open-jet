[project]
name = "open-jet"
version = "0.4.31"
description = "Run local LLMs on your own hardware: a terminal coding agent, and a Python SDK for embedding on-device models in your own applications. No API keys, no data upload."
readme = { file = "README.pypi.md", content-type = "text/markdown" }
requires-python = ">=3.10"
authors = [
    { name = "Louis" }
]
keywords = [
    "llm",
    "local-llm",
    "run-llm-locally",
    "on-device-llm",
    "private-llm",
    "embedded-llm",
    "edge-llm",
    "offline-llm",
    "llm-inference",
    "llm-sdk",
    "gguf",
    "ai-agent",
    "coding-agent",
    "tui",
    "jetson",
    "edge-ai",
    "offline",
    "llama.cpp",
]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    "faster-whisper>=1.2",
    "hf_transfer>=0.1.8",
    "hf_xet>=1.1",
    "huggingface_hub>=0.32",
    "httpx>=0.27",
    "opentelemetry-exporter-otlp-proto-http>=1.40",
    "opentelemetry-sdk>=1.40",
    "prompt_toolkit>=3.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "tiktoken>=0.7",
]

[project.optional-dependencies]
cloud = [
    "keyring>=25",
    "litellm>=1.74",
]
mcp = [
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://openjet.dev/"
Website = "https://openjet.dev/"
Documentation = "https://github.com/l-forster/open-jet/blob/master/docs/getting-started.md"
Repository = "https://github.com/l-forster/open-jet"
Issues = "https://github.com/l-forster/open-jet/issues"

[project.scripts]
open-jet = "src.cli:main"
openjet = "src.cli:main"

[build-system]
requires = ["setuptools>=77,<81", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["src", "src.*", "open_jet", "open_jet.*", "openjet", "openjet.*"]

[tool.setuptools.package-data]
src = ["app.tcss", "data/*.json"]
