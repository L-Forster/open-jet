name: Release platform wheels to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-wheel:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: linux-x64
            wheel-platform: manylinux_2_17_x86_64
          - os: ubuntu-24.04-arm
            artifact: linux-arm64
            wheel-platform: manylinux_2_17_aarch64
          - os: macos-15-intel  # macos-13 runners were retired in December 2025
            artifact: macos-x64
            wheel-platform: macosx_10_15_x86_64
          - os: macos-15
            artifact: macos-arm64
            wheel-platform: macosx_11_0_arm64
          - os: windows-latest
            artifact: windows-x64
            wheel-platform: win_amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install build tools
        # build_tui.py imports src.openrouter_catalog, which needs these at build time
        run: python -m pip install --upgrade build twine wheel "pyyaml>=6.0" "tiktoken>=0.7" "httpx>=0.27"
      - name: Build standalone TUI
        run: python scripts/build_tui.py
      - name: Build wheel
        run: python -m build --wheel
        env:
          OPENJET_WHEEL_PLATFORM: ${{ matrix.wheel-platform }}
      - name: Validate wheel
        run: python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.artifact }}
          path: dist/*.whl

  engine:
    uses: ./.github/workflows/engine.yml

  publish:
    needs: [build-wheel, engine]
    # a failed engine build must not hold back the wheels: setup falls back to compiling the engine
    if: ${{ !cancelled() && needs.build-wheel.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      # prebuilt engine archives that `openjet setup` downloads for this release's version
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: engine-*
          path: release-assets
          merge-multiple: true
      # the one-line installers, served from releases/latest/download/
      - uses: actions/checkout@v4
        with:
          path: source
          sparse-checkout: scripts/installer
      - run: |
          mkdir -p release-assets
          cp source/scripts/installer/install.sh source/scripts/installer/install.ps1 release-assets/
      # attached to the release for this version, from a manual run too (it replaces files of the same name);
      # a manual run of a version that has no release yet attaches nothing
      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('source/pyproject.toml', 'rb'))['project']['version'])")
          if gh release view "v$version" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "v$version" release-assets/* --clobber --repo "${{ github.repository }}"
          else
            echo "::warning::no v$version release; engines and installers not attached"
          fi
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          # a version already uploaded (e.g. by a manual run) is not an error
          skip-existing: true
